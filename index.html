<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
       <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    
<header>
    <h1>RPG Creature Search App</h1>
</header>


<main>

<div id="container">
    <form role="search" id="search-form" >
        <label for="search-input">Search for Creature Name or ID</label>
        <input id="search-input" type="text" name="creature" required>
        <button id="search-button">Search</button>
    </form>

<div id="top-container">

<div class="name-id">
<span id="creature-name" ></span>
<span id="creature-id" ></span>
</div>

<div class="size" >
    <span id="weight"></span>
    <span id="height"></span>
</div>

<div id="types">
    
</div>
<div>
    <div id="special-name"></div>
    <div id="special-description"></div>
</div>

</div>


<div id="container-bottom">

<table>
    <tbody>
    <tr>
        <th>Base</th>
        <th>Stats</th>
    </tr>
    <tr>
        <td>HP :</td>
        <td id="hp"></td>
    </tr>
    <tr>
        <td>Attack :</td>
        <td id="attack"></td>
    </tr>
    <tr>
        <td>Defense :</td>
        <td id="defense"></td>
    </tr>
    <tr>
        <td>Sp. Attack :</td>
        <td id="special-attack" ></td>
    </tr>
    <tr>
        <td>Sp. Defense :</td>
        <td id="special-defense"></td>
    </tr>
    <tr>
        <td>Speed :</td>
        <td id="speed"></td>
    </tr>
    </tbody>
</table>


</div>







</div>






</main>









    <script src="index.js"></script>
</body>
</html>
